<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كل عام وأنت بخير 💗</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; }
  body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg,#ffd6e7,#ffeaf4,#ffd1e1);
    display:flex; align-items:center; justify-content:center;
    color:#8b3158;
  }
  .card {
    width:min(92vw, 520px); padding:28px 22px 32px;
    text-align:center; position:relative; z-index:2;
    background:rgba(255,255,255,.62); border:2px solid rgba(255,255,255,.8);
    border-radius:32px; box-shadow:0 18px 60px rgba(160,55,100,.2);
    backdrop-filter: blur(8px);
  }
  h1 {
    margin:0 0 16px; font-size:clamp(30px,7vw,52px);
    color:#e34f86; text-shadow:0 3px 0 #fff;
  }
  p { margin:0 0 18px; font-size:20px; }
  .nami {
    width:min(75vw,330px); height:min(75vw,330px);
    object-fit:cover; border-radius:50%; border:8px solid #fff;
    box-shadow:0 12px 35px rgba(180,50,100,.28);
  }
  .heart {
    position:fixed; bottom:-50px; left:var(--x);
    font-size:var(--s); opacity:.9; animation:float var(--d) linear infinite;
    animation-delay:var(--delay); pointer-events:none; z-index:1;
  }
  @keyframes float {
    0% { transform:translateY(0) rotate(0deg) scale(.8); opacity:0; }
    10% { opacity:.95; }
    50% { transform:translateY(-55vh) translateX(35px) rotate(15deg) scale(1); }
    100% { transform:translateY(-115vh) translateX(-40px) rotate(-20deg) scale(1.15); opacity:0; }
  }
  .sparkle { position:absolute; font-size:25px; animation:pulse 1.6s infinite alternate; }
  @keyframes pulse { to { transform:scale(1.35) rotate(12deg); opacity:.65; } }
</style>
</head>

  const h=document.createElement("div");
  h.className="heart";
  h.textContent=hearts[Math.floor(Math.random()*hearts.length)];
  h.style.setProperty("--x", Math.random()*100+"vw");
  h.style.setProperty("--s", (18+Math.random()*34)+"px");
  h.style.setProperty("--d", (5+Math.random()*8)+"s");
  h.style.setProperty("--delay", (-Math.random()*10)+"s");
  document.body.appendChild(h);
}
</script>
</body>
</html>
